<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Negocio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>
/* ============================================================
   PANEL DE CONFIGURACIÓN — editá solo esto y listo
   ============================================================ */
const CONFIG = {
  nombre: "Taller Rodríguez",
  rubro: "Service de bicicletas y mantenimiento",
  frase: "Arreglamos tu bici rápido, bien y al tiro.",
  sobreMi: "Somos un taller de barrio con más de 8 años de experiencia. Service completo, reparaciones y repuestos, con presupuesto claro antes de arrancar.",
  servicios: [
    { icono: "🔧", titulo: "Service general", detalle: "Revisión completa, frenos, cambios y engrase." },
    { icono: "⚙️", titulo: "Reparaciones", detalle: "Pinchaduras, cadenas, rayos y más." },
    { icono: "🚲", titulo: "Armado a medida", detalle: "Armamos tu bici desde cero." },
    { icono: "🛒", titulo: "Repuestos", detalle: "Amplio stock de repuestos originales." }
  ],
  fotos: [
    "https://images.unsplash.com/photo-1673870861521-626b40f9657e?w=900&q=80&auto=format&fit=crop",
    "https://images.unsplash.com/photo-1561840884-9dda41ed54e4?w=900&q=80&auto=format&fit=crop"
  ],
  whatsapp: "5491100000000",     // sin +, sin espacios, con código de país
  mensajeWhatsapp: "Hola, quería consultar por un turno.",
  email: "contacto@ejemplo.com",
  direccion: "Av. Siempre Viva 123, Buenos Aires"
};
</script>
<style>
  :root{
    --azul:#2A6F7F;
    --verde:#6FA98A;
    --bg:#F9FAFB;
    --ink:#1F2937;
    --border:#E5E7EB;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.6;
  }
  h1,h2,h3{font-family:'Sora',sans-serif; font-weight:700;}
  .wrap{max-width:1080px; margin:0 auto; padding:0 24px;}

  header{
    padding:20px 0; background:white; border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:10;
  }
  header .wrap{display:flex; justify-content:space-between; align-items:center;}
  .brand{font-family:'Sora',sans-serif; font-weight:700; font-size:1.2rem; color:var(--azul);}
  nav{display:flex; gap:24px; align-items:center;}
  nav a{color:var(--ink); text-decoration:none; font-size:0.92rem; font-weight:500;}
  nav a.cta{
    background:var(--azul); color:white; padding:9px 18px; border-radius:8px;
  }

  .hero{padding:70px 0;}
  .hero .grid{display:grid; grid-template-columns:1.1fr 1fr; gap:50px; align-items:center;}
  .hero h1{font-size:2.6rem; line-height:1.15; margin-bottom:16px; color:var(--ink);}
  .hero .rubro{color:var(--azul); font-weight:600; margin-bottom:14px;}
  .hero .frase{color:#555; font-size:1.05rem; margin-bottom:30px; max-width:440px;}
  .hero-botones{display:flex; gap:14px; flex-wrap:wrap;}
  .btn{
    display:inline-block; padding:13px 24px; border-radius:8px; text-decoration:none;
    font-weight:600; font-size:0.95rem;
  }
  .btn.primary{background:var(--azul); color:white;}
  .btn.secondary{background:white; color:var(--azul); border:1px solid var(--border);}
  .hero-img{width:100%; height:340px; object-fit:cover; border-radius:16px;}

  section{padding:60px 0;}
  .section-head{margin-bottom:36px;}
  .eyebrow{color:var(--verde); font-weight:600; font-size:0.85rem; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:8px;}
  .section-head h2{font-size:1.9rem;}

  .sobre-grid{display:grid; grid-template-columns:1fr 1fr; gap:40px; align-items:center;}
  .sobre-grid p{color:#4a4a4a; font-size:1.02rem;}
  .sobre-img{width:100%; height:280px; object-fit:cover; border-radius:16px;}

  .servicios{background:white; border-top:1px solid var(--border); border-bottom:1px solid var(--border);}
  .servicios-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:20px;}
  .servicio-card{
    padding:26px 20px; border:1px solid var(--border); border-radius:12px;
    transition:transform .15s, box-shadow .15s;
  }
  .servicio-card:hover{transform:translateY(-4px); box-shadow:0 8px 20px rgba(0,0,0,0.06);}
  .servicio-card .icono{font-size:1.7rem; margin-bottom:12px;}
  .servicio-card h3{font-size:1.05rem; margin-bottom:6px;}
  .servicio-card p{color:#666; font-size:0.9rem;}

  .contacto-box{
    background:var(--azul); border-radius:20px; padding:56px 40px;
    display:flex; justify-content:space-between; align-items:center; gap:30px; flex-wrap:wrap;
    color:white;
  }
  .contacto-box h2{color:white; font-size:1.8rem; margin-bottom:8px;}
  .contacto-box p{opacity:0.9;}
  .contacto-botones{display:flex; gap:14px; flex-wrap:wrap;}
  .btn-white{background:white; color:var(--azul);}
  .btn-outline{border:1px solid rgba(255,255,255,0.6); color:white;}

  footer{
    padding:30px 0; text-align:center; color:#888; font-size:0.85rem;
    border-top:1px solid var(--border);
  }

  @media(max-width:800px){
    .hero .grid, .sobre-grid{grid-template-columns:1fr;}
    .servicios-grid{grid-template-columns:1fr 1fr;}
    nav a:not(.cta){display:none;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand" id="brand"></div>
    <nav>
      <a href="#sobre">Nosotros</a>
      <a href="#servicios">Servicios</a>
      <a class="cta" id="navWhatsapp" target="_blank">WhatsApp</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="wrap grid">
    <div>
      <h1 id="nombreHero"></h1>
      <div class="rubro" id="rubroHero"></div>
      <p class="frase" id="fraseHero"></p>
      <div class="hero-botones">
        <a class="btn primary" id="btnWhatsapp1" target="_blank">Escribinos por WhatsApp</a>
        <a class="btn secondary" id="btnEmail1">Enviar mail</a>
      </div>
    </div>
    <img class="hero-img" id="heroImg">
  </div>
</section>

<section id="sobre">
  <div class="wrap">
    <div class="section-head">
      <div class="eyebrow">Sobre nosotros</div>
      <h2>Quiénes somos</h2>
    </div>
    <div class="sobre-grid">
      <p id="sobreMiTexto"></p>
      <img class="sobre-img" id="sobreImg">
    </div>
  </div>
</section>

<section id="servicios" class="servicios">
  <div class="wrap">
    <div class="section-head">
      <div class="eyebrow">Servicios</div>
      <h2>Qué ofrecemos</h2>
    </div>
    <div class="servicios-grid" id="serviciosWrap"></div>
  </div>
</section>

<section id="contacto">
  <div class="wrap">
    <div class="contacto-box">
      <div>
        <h2>¿Consultas?</h2>
        <p id="direccionTexto"></p>
      </div>
      <div class="contacto-botones">
        <a class="btn btn-white" id="btnWhatsapp2" target="_blank">WhatsApp</a>
        <a class="btn btn-outline" id="btnEmail2">Enviar mail</a>
      </div>
    </div>
  </div>
</section>

<footer id="footer"></footer>

<script>
  document.getElementById('brand').textContent = CONFIG.nombre;
  document.getElementById('nombreHero').textContent = CONFIG.nombre;
  document.getElementById('rubroHero').textContent = CONFIG.rubro;
  document.getElementById('fraseHero').textContent = CONFIG.frase;
  document.getElementById('sobreMiTexto').textContent = CONFIG.sobreMi;
  document.getElementById('direccionTexto').textContent = CONFIG.direccion;

  document.getElementById('heroImg').src = CONFIG.fotos[0] || '';
  document.getElementById('sobreImg').src = CONFIG.fotos[1] || CONFIG.fotos[0] || '';

  const serviciosWrap = document.getElementById('serviciosWrap');
  CONFIG.servicios.forEach(s => {
    const div = document.createElement('div');
    div.className = 'servicio-card';
    div.innerHTML = `
      <div class="icono">${s.icono}</div>
      <h3>${s.titulo}</h3>
      <p>${s.detalle}</p>`;
    serviciosWrap.appendChild(div);
  });

  /* ============================================================
     MODO DEMO — true: los botones de WhatsApp/mail no llevan a
     ningún lado (solo para mostrar el diseño). false: funcionan
     normal, con los links reales de arriba.
     ============================================================ */
  const MODO_DEMO = true;

  const waLink = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(CONFIG.mensajeWhatsapp)}`;
  const mailLink = `mailto:${CONFIG.email}`;

  const botonesContacto = [
    document.getElementById('navWhatsapp'),
    document.getElementById('btnWhatsapp1'),
    document.getElementById('btnWhatsapp2'),
    document.getElementById('btnEmail1'),
    document.getElementById('btnEmail2')
  ];

  if (MODO_DEMO) {
    // No asignamos href real y bloqueamos la navegación al hacer click.
    botonesContacto.forEach(btn => {
      btn.href = '#';
      btn.removeAttribute('target');
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        mostrarAvisoDemo();
      });
    });
  } else {
    document.getElementById('navWhatsapp').href = waLink;
    document.getElementById('btnWhatsapp1').href = waLink;
    document.getElementById('btnWhatsapp2').href = waLink;
    document.getElementById('btnEmail1').href = mailLink;
    document.getElementById('btnEmail2').href = mailLink;
  }

  function mostrarAvisoDemo() {
    let aviso = document.getElementById('avisoDemo');
    if (!aviso) {
      aviso = document.createElement('div');
      aviso.id = 'avisoDemo';
      aviso.textContent = 'Esto es una web de muestra — los botones no llevan a ningún lado.';
      aviso.style.cssText = `
        position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
        background:var(--ink); color:white; padding:12px 20px; border-radius:8px;
        font-size:0.85rem; z-index:999; opacity:0; transition:opacity .2s;
        box-shadow:0 8px 20px rgba(0,0,0,0.2); max-width:90%; text-align:center;
      `;
      document.body.appendChild(aviso);
    }
    aviso.style.opacity = '1';
    clearTimeout(aviso._timeout);
    aviso._timeout = setTimeout(() => { aviso.style.opacity = '0'; }, 2200);
  }

  document.getElementById('footer').textContent = `© ${new Date().getFullYear()} ${CONFIG.nombre}`;
</script>

</body>
</html>
