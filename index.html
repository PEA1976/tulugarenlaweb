<style>
  :root{
    --paper:#F2F0E6;
    --paper-soft:#E7E2D2;
    --ink:#191B22;
    --ink-soft:#4E5462;
    --plate:#1E3A5F;
    --plate-dark:#122A45;
    --rust:#C1440E;
    --rust-dark:#9C3509;
    --brass:#B9892E;
    --line:#D9D2BC;
    --maxw:1120px;
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:800;
    line-height:1;
    letter-spacing:0.01em;
    text-transform:uppercase;
  }
  .mono{font-family:'Space Mono', monospace;}
  a{color:inherit;}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 28px;}
  a:focus-visible, button:focus-visible{outline:3px solid var(--plate); outline-offset:3px;}

  /* ---------- HEADER ---------- */
  header{
    position:sticky; top:0; z-index:50;
    background:rgba(242,240,230,0.94);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 28px; max-width:var(--maxw); margin:0 auto;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    text-decoration:none; color:var(--ink);
  }
  .brand-plate{
    background:var(--plate); color:#fff; font-family:'Space Mono',monospace;
    font-weight:700; font-size:0.72rem; letter-spacing:0.06em;
    padding:6px 9px; border-radius:4px; border:1.5px solid var(--brass);
  }
  .brand-text{font-family:'Big Shoulders Display',sans-serif; font-weight:800; font-size:1.25rem; text-transform:uppercase;}
  nav ul{list-style:none; display:flex; gap:26px;}
  nav a{
    text-decoration:none; font-weight:600; font-size:0.9rem;
    border-bottom:2px solid transparent; padding-bottom:4px;
    transition:border-color .2s ease;
  }
  nav a:hover{border-color:var(--rust);}
  .nav-cta{
    background:var(--rust); color:#fff;
    padding:10px 18px; border-radius:999px; font-weight:700; font-size:0.85rem;
    text-decoration:none; white-space:nowrap;
  }
  .nav-cta:hover{background:var(--rust-dark);}
  .burger{display:none; background:none; border:none; cursor:pointer;}
  .burger span{display:block; width:22px; height:2px; background:var(--ink); margin:5px 0;}

  /* ============================================================
     FIX MENU MOBILE
     ============================================================ */
  @media (max-width:860px){
    .nav{ position:relative; flex-wrap:wrap; }
    nav ul{
      position:absolute; top:100%; left:0; right:0;
      background:rgba(242,240,230,0.98);
      backdrop-filter:blur(6px);
      flex-direction:column; padding:18px 28px; gap:16px;
      border-bottom:1px solid var(--line);
      box-shadow:0 12px 20px rgba(25,27,34,0.10);
      transform:translateY(-8px); opacity:0; visibility:hidden; pointer-events:none;
      transition:transform .2s ease, opacity .2s ease, visibility .2s;
      z-index:40;
    }
    nav ul.open{
      transform:translateY(0); opacity:1; visibility:visible; pointer-events:auto;
    }
    .burger{display:block;}
    .nav-cta{display:none;}
  }

  /* ---------- HERO ---------- */
  .hero{padding:70px 0 60px; border-bottom:1px solid var(--line);}
  .hero-grid{display:grid; grid-template-columns:1.05fr 0.95fr; gap:54px; align-items:center;}
  .kicker{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'Space Mono', monospace; font-size:0.76rem;
    color:var(--rust); text-transform:uppercase; letter-spacing:0.1em;
    margin-bottom:16px; font-weight:700;
  }
  .kicker::before{content:''; width:7px; height:7px; border-radius:50%; background:var(--rust);}
  .hero h1{font-size:clamp(2.1rem, 4.4vw, 3.1rem); max-width:15ch; text-transform:none;}
  .hero h1 span{color:var(--rust);}
  .hero p.lead{margin-top:20px; font-size:1.1rem; color:var(--ink-soft); max-width:46ch;}
  .hero-actions{display:flex; gap:14px; margin-top:30px; flex-wrap:wrap;}
  .btn-primary, .btn-secondary{
    padding:14px 26px; border-radius:999px; font-weight:700; text-decoration:none;
    font-size:0.95rem; display:inline-flex; align-items:center; gap:8px; border:2px solid transparent;
  }
  .btn-primary{background:var(--rust); color:#fff;}
  .btn-primary:hover{background:var(--rust-dark);}
  .btn-secondary{border-color:var(--ink); color:var(--ink);}
  .btn-secondary:hover{background:var(--ink); color:var(--paper);}
  .hero-note{margin-top:16px; font-size:0.85rem; color:var(--ink-soft);}

  /* hero visual: enamel street-sign plaque */
  .placa{
    background:var(--plate);
    border-radius:16px;
    border:3px solid var(--brass);
    padding:44px 34px;
    position:relative;
    box-shadow:0 18px 40px rgba(18,42,69,0.28), inset 0 0 0 1px rgba(255,255,255,0.06);
  }
  .placa::before, .placa::after{
    content:''; position:absolute; width:11px; height:11px; border-radius:50%;
    background:var(--brass); top:14px; box-shadow:0 0 0 2px var(--plate-dark);
  }
  .placa::before{left:14px;}
  .placa::after{right:14px;}
  .placa .placa-eyebrow{
    font-family:'Space Mono',monospace; color:#B9D4E8; font-size:0.72rem;
    letter-spacing:0.14em; text-transform:uppercase; margin-bottom:14px;
  }
  .placa h2{
    color:#fff; font-size:clamp(1.9rem,4vw,2.6rem); line-height:1.02; text-transform:uppercase;
  }
  .placa .domicilio{
    margin-top:22px; padding-top:20px; border-top:1px dashed rgba(255,255,255,0.28);
    font-family:'Space Mono',monospace; color:#DCE7EE; font-size:0.85rem; letter-spacing:0.03em;
  }
  .placa .domicilio b{color:var(--brass); display:block; font-size:0.72rem; letter-spacing:0.1em; margin-bottom:6px;}
  @media (max-width:860px){
    .hero-grid{grid-template-columns:1fr;}
    .placa{max-width:460px; margin:0 auto;}
  }

  /* ---------- SECTION SHARED ---------- */
  section{padding:76px 0;}
  .section-head{max-width:58ch; margin-bottom:42px;}
  .section-head .kicker{margin-bottom:12px;}
  .section-head h2{font-size:clamp(1.7rem, 3vw, 2.3rem); text-transform:uppercase;}
  .section-head p{color:var(--ink-soft); margin-top:14px; font-size:1.05rem;}

  /* ---------- BENEFICIOS ---------- */
  .benef-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:18px;}
  .benef-card{
    background:#fff; border-radius:var(--radius); padding:26px 22px;
    border:1px solid var(--line); transition:transform .18s ease, box-shadow .18s ease;
  }
  .benef-card:hover{transform:translateY(-4px); box-shadow:0 10px 24px rgba(25,27,34,0.08);}
</style>
</head>
