<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Emprendimiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<script>
/* ============================================================
   PANEL DE CONFIGURACIÓN — editá solo esto y listo
   ============================================================ */
const CONFIG = {
  nombre: "Flor Espósito",
  rubro: "Entrenadora personal & nutrición deportiva",
  frase: "Te ayudo a moverte mejor y sentirte con más energía 💪",
  sobreMi: "Soy profe de educación física hace 6 años. Armo rutinas a medida, sin vueltas, para que entrenes en casa, al aire libre o en el gym. Cero excusas, mucho acompañamiento.",
  servicios: [
    { emoji: "🏋️", titulo: "Rutinas personalizadas", detalle: "Plan de entrenamiento armado 100% para vos." },
    { emoji: "🥗", titulo: "Plan nutricional", detalle: "Guía simple para comer mejor sin sufrir." },
    { emoji: "📲", titulo: "Seguimiento online", detalle: "Acompañamiento semanal por WhatsApp." },
    { emoji: "🔥", titulo: "Clases grupales", detalle: "Entrená con más gente y no aflojes." }
  ],
  fotos: [
    "https://picsum.photos/seed/informal1/500/500",
    "https://picsum.photos/seed/informal2/500/500",
    "https://picsum.photos/seed/informal3/500/500"
  ],
  whatsapp: "5491100000000",     // sin +, sin espacios, con código de país
  mensajeWhatsapp: "Hola! Quiero saber más 🙌",
  email: "hola@ejemplo.com"
};
</script>
<style>
  :root{
    --mostaza:#F2B134;
    --teal:#134E4A;
    --coral:#FF6F59;
    --crema:#FFFDF7;
    --ink:#1A1A1A;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--crema);
    color:var(--ink);
    font-family:'Nunito',sans-serif;
    overflow-x:hidden;
  }
  h1,h2,h3{font-family:'Baloo 2',sans-serif;}
  .wrap{max-width:960px; margin:0 auto; padding:0 24px;}

  header{
    padding:22px 0;
    display:flex; justify-content:space-between; align-items:center;
  }
  header .wrap{display:flex; justify-content:space-between; align-items:center;}
  .brand{font-family:'Baloo 2',sans-serif; font-weight:800; font-size:1.4rem; color:var(--teal);}
  .navcta{
    background:var(--coral); color:white; text-decoration:none;
    padding:10px 20px; border-radius:40px; font-weight:700; font-size:0.9rem;
  }

  .hero{
    position:relative;
    background:var(--teal);
    color:var(--crema);
    padding:90px 0 110px;
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute; bottom:-2px; left:0; right:0; height:60px;
    background:var(--crema);
    clip-path: polygon(0 100%, 100% 0, 100% 100%);
  }
  .hero .wrap{position:relative; z-index:2;}
  .hero .badge{
    display:inline-block; background:var(--mostaza); color:var(--ink);
    padding:6px 16px; border-radius:30px; font-weight:700; font-size:0.85rem;
    transform:rotate(-3deg); margin-bottom:22px;
  }
  .hero h1{font-size:3rem; margin-bottom:12px; line-height:1.1;}
  .hero .rubro{font-size:1.15rem; opacity:0.9; margin-bottom:20px;}
  .hero .frase{font-size:1.1rem; max-width:460px; opacity:0.95;}
  .hero .cta-row{margin-top:34px; display:flex; gap:14px; flex-wrap:wrap;}
  .btn-big{
    display:inline-block; padding:16px 30px; border-radius:40px;
    text-decoration:none; font-weight:700; font-size:1rem;
  }
  .btn-big.primary{background:var(--coral); color:white;}
  .btn-big.ghost{border:2px solid var(--crema); color:var(--crema);}

  section{padding:70px 0;}
  .section-title{font-size:2.1rem; color:var(--teal); margin-bottom:24px;}
  .sobre-mi p{max-width:560px; font-size:1.05rem; color:#333;}

  .fotos-grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:36px;
  }
  .fotos-grid img{
    width:100%; height:220px; object-fit:cover; border-radius:18px;
    box-shadow:0 8px 20px rgba(0,0,0,0.12);
  }
  .fotos-grid img:nth-child(2){transform:rotate(-2deg);}
  .fotos-grid img:nth-child(1){transform:rotate(1.5deg);}
  .fotos-grid img:nth-child(3){transform:rotate(-1deg);}

  .servicios{background:#FFF6E5;}
  .servicios-grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:20px; margin-top:30px;
  }
  .servicio-card{
    background:white; border-radius:20px; padding:26px;
    box-shadow:0 6px 18px rgba(0,0,0,0.06);
  }
  .servicio-card .emoji{font-size:1.8rem; margin-bottom:10px;}
  .servicio-card h3{font-size:1.2rem; color:var(--teal); margin-bottom:6px;}
  .servicio-card p{color:#555; font-size:0.95rem;}

  .contacto{
    text-align:center; background:var(--mostaza); border-radius:28px;
    padding:60px 30px; margin:0 24px 70px;
  }
  .contacto h2{font-size:2rem; color:var(--ink); margin-bottom:14px;}
  .contacto p{color:#3a3a3a; margin-bottom:30px;}
  .contacto-botones{display:flex; gap:16px; justify-content:center; flex-wrap:wrap;}
  .btn-contact{
    padding:16px 32px; border-radius:40px; text-decoration:none; font-weight:700;
  }
  .btn-contact.wa{background:var(--teal); color:white;}
  .btn-contact.mail{background:white; color:var(--teal); border:2px solid var(--teal);}

  footer{text-align:center; padding:30px; font-size:0.85rem; color:#888;}

  @media(max-width:640px){
    .hero h1{font-size:2.1rem;}
    .fotos-grid{grid-template-columns:1fr 1fr;}
    .servicios-grid{grid-template-columns:1fr;}
    .contacto{margin:0 12px 50px; padding:40px 20px;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand" id="brand"></div>
    <a class="navcta" id="navWhatsapp" target="_blank">WhatsApp</a>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <span class="badge">✨ Disponible ahora</span>
    <h1 id="nombreHero"></h1>
    <div class="rubro" id="rubroHero"></div>
    <p class="frase" id="fraseHero"></p>
    <div class="cta-row">
      <a class="btn-big primary" id="btnWhatsapp1" target="_blank">Escribime al WhatsApp</a>
      <a class="btn-big ghost" href="#servicios">Ver servicios</a>
    </div>
  </div>
</section>

<section id="sobre">
  <div class="wrap">
    <h2 class="section-title">¿Quién soy?</h2>
    <div class="sobre-mi">
      <p id="sobreMiTexto"></p>
    </div>
    <div class="fotos-grid" id="fotosWrap"></div>
  </div>
</section>

<section id="servicios" class="servicios">
  <div class="wrap">
    <h2 class="section-title">Qué te ofrezco</h2>
    <div class="servicios-grid" id="serviciosWrap"></div>
  </div>
</section>

<section id="contacto">
  <div class="wrap">
    <div class="contacto">
      <h2>¿Hablamos?</h2>
      <p>Contame qué necesitás y armamos algo juntos.</p>
      <div class="contacto-botones">
        <a class="btn-contact wa" id="btnWhatsapp2" target="_blank">WhatsApp</a>
        <a class="btn-contact mail" id="btnEmail">Mandar mail</a>
      </div>
    </div>
  </div>
</section>

<footer id="footer"></footer>

<script>
  document.getElementById('brand').textContent = CONFIG.nombre;
  document.getElementById('nombreHero').textContent = CONFIG.nombre;
  document.getElementById('rubroHero').textContent = CONFIG.rubro;
  document.getElementById('fraseHero').textContent = CONFIG.frase;
  document.getElementById('sobreMiTexto').textContent = CONFIG.sobreMi;

  const fotosWrap = document.getElementById('fotosWrap');
  CONFIG.fotos.forEach(src => {
    const img = document.createElement('img');
    img.src = src;
    fotosWrap.appendChild(img);
  });

  const serviciosWrap = document.getElementById('serviciosWrap');
  CONFIG.servicios.forEach(s => {
    const div = document.createElement('div');
    div.className = 'servicio-card';
    div.innerHTML = `
      <div class="emoji">${s.emoji}</div>
      <h3>${s.titulo}</h3>
      <p>${s.detalle}</p>`;
    serviciosWrap.appendChild(div);
  });

  const waLink = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(CONFIG.mensajeWhatsapp)}`;
  document.getElementById('navWhatsapp').href = waLink;
  document.getElementById('btnWhatsapp1').href = waLink;
  document.getElementById('btnWhatsapp2').href = waLink;
  document.getElementById('btnEmail').href = `mailto:${CONFIG.email}`;

  document.getElementById('footer').textContent = `© ${new Date().getFullYear()} ${CONFIG.nombre}`;
</script>

</body>
</html>
